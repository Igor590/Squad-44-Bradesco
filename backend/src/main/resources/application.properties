spring.application.name=financiamentos-squad44
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bradesco_financiamentos}
spring.datasource.username=${DB_USER:bradesco_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
app.score-demonstrativo=700
